name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [windows]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "Windows/**"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "Windows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423

      - name: Restore
        run: dotnet restore Windows/DjiRcJoystick.Windows.sln

      - name: Test
        run: dotnet test Windows/DjiRcJoystick.Windows.sln -c Release --no-restore

      - name: Publish self-contained application
        shell: pwsh
        run: |
          dotnet publish Windows/src/DjiRcJoystick.App/DjiRcJoystick.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false `
            -o Windows/publish

      - name: Download pinned vJoy installer
        shell: pwsh
        run: |
          $directory = "Windows/installer/vendor"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $path = Join-Path $directory "vJoySetup.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jshafer817/vJoy/releases/download/v2.1.9.1/vJoySetup.exe" `
            -OutFile $path
          $expected = "f103ced4e7ff7ccb49c8415a542c56768ed4da4fea252b8f4ffdac343074654a"
          $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "vJoy installer checksum mismatch: $actual"
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "Windows\installer\DjiRCJoystick.iss"

      - name: Write checksum
        shell: pwsh
        run: |
          $installer = Get-Item "Windows/installer/output/DjiRCJoystickSetup-*.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content `
            "Windows/installer/output/SHA256SUMS.txt" -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DjiRCJoystick-Windows-installer
          path: Windows/installer/output/*
          if-no-files-found: error
